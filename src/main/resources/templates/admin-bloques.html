
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de bloques | Zacatlán</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Zacatlán</a>
        <a class="btn btn-outline-light" th:href="@{/admin}">Volver al panel</a>
    </div>
</nav>

<main class="container py-4">

    <h2 class="mb-2">Gestión de bloques</h2>
    <p class="text-muted">
        Administra los bloques disponibles para los vendedores.
    </p>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <!-- Crear bloque -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            Crear nuevo bloque
        </div>

        <div class="card-body">
            <form th:action="@{/admin/bloques/crear}" method="post">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text"
                           class="form-control"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">
                        Descripción
                    </label>
                    <textarea class="form-control"
                              id="descripcion"
                              name="descripcion"
                              maxlength="255"
                              rows="2"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Crear bloque
                </button>
            </form>
        </div>
    </div>

    <!-- Listado de bloques -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            Bloques registrados
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(bloques)}"
                 class="alert alert-info mb-0">
                No hay bloques registrados.
            </div>

            <div th:unless="${#lists.isEmpty(bloques)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="bloque : ${bloques}">

                        <td th:text="${bloque.id}"></td>

                        <td>
                            <form th:action="@{/admin/bloques/modificar/{id}(id=${bloque.id})}"
                                  method="post">

                                <input type="text"
                                       name="nombre"
                                       class="form-control mb-2"
                                       th:value="${bloque.nombre}"
                                       maxlength="100"
                                       required>

                                <textarea name="descripcion"
                                          class="form-control mb-2"
                                          rows="2"
                                          maxlength="255"
                                          th:text="${bloque.descripcion}"></textarea>

                                <button type="submit"
                                        class="btn btn-sm btn-primary">
                                    Guardar cambios
                                </button>
                            </form>
                        </td>

                        <td>
                            <span th:text="${bloque.descripcion}"></span>
                        </td>

                        <td>
                            <span th:if="${bloque.activo}"
                                  class="badge text-bg-success">
                                Activo
                            </span>

                            <span th:unless="${bloque.activo}"
                                  class="badge text-bg-secondary">
                                Inactivo
                            </span>
                        </td>

                        <td>
                            <form th:action="@{/admin/bloques/estado/{id}(id=${bloque.id})}"
                                  method="post">

                                <input type="hidden"
                                       name="activar"
                                       th:value="${!bloque.activo}">

                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${bloque.activo} ? ' btn-danger' : ' btn-success'"
                                        th:text="${bloque.activo} ? 'Desactivar' : 'Activar'">
                                </button>
                            </form>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>

</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
