
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de venta</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Zacatlán</a>
        <a class="btn btn-outline-light" th:href="@{/admin/ventas}">
            Volver al historial
        </a>
    </div>
</nav>

<div class="container mt-4">

    <h2>Detalle de venta</h2>
    <p class="text-muted">
        Consulta los productos incluidos en esta venta.
    </p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h5 class="card-title mb-3"
                th:text="'Venta #' + ${venta.idVenta}">
            </h5>

            <p>
                <strong>Vendedor:</strong>
                <span th:text="${venta.nombreVendedor}"></span>
            </p>

            <p>
                <strong>Fecha y hora:</strong>
                <span th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}"></span>
            </p>

            <p>
                <strong>Método de pago:</strong>
                <span th:text="${venta.metodoPago}"></span>
            </p>

            <p>
                <strong>Estado:</strong>
                <span th:text="${venta.estado}"></span>
            </p>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="mb-3">Productos vendidos</h5>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="detalle : ${venta.detalles}">
                        <td th:text="${detalle.nombreProducto}"></td>

                        <td th:text="${detalle.cantidad}"></td>

                        <td th:text="${'$' + #numbers.formatDecimal(detalle.precioUnitario, 1, 2)}"></td>

                        <td th:text="${'$' + #numbers.formatDecimal(detalle.subTotal, 1, 2)}"></td>
                    </tr>

                    </tbody>

                    <tfoot>
                    <tr class="table-light">
                        <th colspan="3" class="text-end">
                            Total de la venta:
                        </th>

                        <th th:text="${'$' + #numbers.formatDecimal(venta.total, 1, 2)}"></th>
                    </tr>
                    </tfoot>

                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-secondary" th:href="@{/admin/ventas}">
            Regresar al historial
        </a>
    </div>

</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
