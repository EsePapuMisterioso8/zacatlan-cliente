
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de venta - Zacatlán</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/vendedor}">Zacatlán</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Detalle de venta</h2>
            <p class="text-muted mb-0">
                Consulta los productos incluidos en esta venta.
            </p>
        </div>

        <a th:href="@{/vendedor/ventas}" class="btn btn-secondary">
            Volver al historial
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0">
                Venta #<span th:text="${venta.idVenta}"></span>
            </h5>
        </div>

        <div class="card-body">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <strong>Vendedor:</strong>
                    <span th:text="${venta.nombreVendedor}"></span>
                </div>

                <div class="col-md-6 mb-3">
                    <strong>Fecha y hora:</strong>
                    <span th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}"></span>
                </div>

                <div class="col-md-6 mb-3">
                    <strong>Método de pago:</strong>
                    <span th:text="${venta.metodoPago}"></span>
                </div>

                <div class="col-md-6 mb-3">
                    <strong>Estado:</strong>
                    <span th:text="${venta.estado}"></span>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Productos vendidos</h5>
        </div>

        <div class="card-body">

            <div th:if="${venta.detalles == null or #lists.isEmpty(venta.detalles)}"
                 class="alert alert-info">
                Esta venta no contiene detalles.
            </div>

            <div th:if="${venta.detalles != null and !#lists.isEmpty(venta.detalles)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle">
                    <thead class="table-success">
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="detalle : ${venta.detalles}">
                        <td th:text="${detalle.nombreProducto}"></td>
                        <td th:text="${detalle.cantidad}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(detalle.precioUnitario, 1, 2)}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(detalle.subTotal, 1, 2)}"></td>
                    </tr>
                    </tbody>

                    <tfoot>
                    <tr class="table-light">
                        <th colspan="3" class="text-end">Total de la venta:</th>
                        <th th:text="${'$' + #numbers.formatDecimal(venta.total, 1, 2)}"></th>
                    </tr>
                    </tfoot>
                </table>

            </div>

        </div>
    </div>

</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
