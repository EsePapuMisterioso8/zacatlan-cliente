
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de ventas - Zacatlán</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/vendedor}">Zacatlán</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Historial de ventas</h2>
            <p class="text-muted mb-0">
                Consulta las ventas que has registrado.
            </p>
        </div>
        <a th:href="@{/vendedor}" class="btn btn-secondary">Volver</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Mis ventas</h5>
        </div>

        <div class="card-body">

            <div th:if="${ventas == null or #lists.isEmpty(ventas)}"
                 class="alert alert-info mb-0">
                Todavía no tienes ventas registradas.
            </div>

            <div th:if="${ventas != null and !#lists.isEmpty(ventas)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle">
                    <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Vendedor</th>
                        <th>Fecha y hora</th>
                        <th>Total</th>
                        <th>Método de pago</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.idVenta}"></td>
                        <td th:text="${venta.nombreVendedor}"></td>
                        <td th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(venta.total, 1, 2)}"></td>
                        <td th:text="${venta.metodoPago}"></td>
                        <td>
                            <a th:href="@{/vendedor/ventas/{id}(id=${venta.idVenta})}"
                               class="btn btn-primary btn-sm">
                                Ver detalle
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/vendedor/ventas/nueva}" class="btn btn-success">
            Registrar otra venta
        </a>
    </div>

</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
