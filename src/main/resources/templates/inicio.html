
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio | Zacatlán</title>

    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Zacatlán
        </a>
    </div>
</nav>

<main class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card border-0 shadow-sm text-center p-4 p-md-5"
         style="max-width: 650px; width: 100%;">

        <h1 class="fw-bold mb-3">Bienvenido a Zacatlán</h1>

        <p class="text-muted mb-4">
            Sistema de administración de vendedores, productos y ventas.
            Ingresa a tu cuenta o solicita tu registro como vendedor.
        </p>

        <div class="d-grid gap-3">

            <a th:href="@{/login}"
               class="btn btn-dark btn-lg">
                Iniciar sesión
            </a>

            <a th:href="@{/registro-vendedor}"
               class="btn btn-outline-primary btn-lg">
                Registrarme como vendedor
            </a>

        </div>

    </div>

</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
