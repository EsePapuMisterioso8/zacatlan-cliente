
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Iniciar sesión - Zacatlán</title>

    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/bootstrap/css/zacatlan-theme.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Zacatlán
        </a>
    </div>
</nav>

<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="card border-0 shadow-sm p-4 p-md-5"
         style="width: 100%; max-width: 440px;">

        <div class="text-center mb-4">

            <span class="badge bg-primary px-3 py-2 mb-3">
                Acceso al sistema
            </span>

            <h2 class="fw-bold mb-2">
                Iniciar sesión
            </h2>

            <p class="text-muted mb-0">
                Ingresa tus credenciales para continuar.
            </p>

        </div>

        <!-- Mensaje de error -->
        <div th:if="${error}"
             class="alert alert-danger"
             role="alert"
             th:text="${error}">
        </div>

        <!-- Formulario -->
        <form th:action="@{/login}"
              th:object="${loginRequest}"
              method="POST">

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">
                    Usuario
                </label>

                <input type="text"
                       class="form-control form-control-lg"
                       id="username"
                       th:field="*{username}"
                       placeholder="Escribe tu usuario"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                    Contraseña
                </label>

                <input type="password"
                       class="form-control form-control-lg"
                       id="password"
                       th:field="*{password}"
                       placeholder="Escribe tu contraseña"
                       autocomplete="current-password"
                       required>
            </div>

            <div class="d-grid gap-2 mt-4">

                <button type="submit" class="btn btn-primary btn-lg">
                    Ingresar
                </button>

                <a th:href="@{/}"
                   class="btn btn-outline-secondary">
                    Volver al inicio
                </a>

            </div>

        </form>

        <div class="text-center mt-4">
            <p class="text-muted small mb-1">
                ¿Aún no tienes una cuenta?
            </p>

            <a th:href="@{/registro-vendedor}"
               class="text-decoration-none fw-semibold">
                Solicitar registro como vendedor
            </a>
        </div>

        <hr class="my-4">

        <p class="text-muted text-center small mb-0">
            Zacatlán · Sistema de administración de vendedores y ventas
        </p>

    </div>

</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
