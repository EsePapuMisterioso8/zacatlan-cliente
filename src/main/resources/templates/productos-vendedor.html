<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis productos | Zacatlán</title>

    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/vendedor}">
            Zacatlán
        </a>

        <span class="navbar-text text-white">
            Mi inventario
        </span>

        <a th:href="@{/logout}" class="btn btn-outline-light">
            Cerrar sesión
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="fw-bold">Mis productos</h2>
            <p class="text-muted mb-0">
                Consulta los productos que tienes registrados en tu inventario.
            </p>
        </div>

        <a th:href="@{/vendedor}" class="btn btn-outline-secondary">
            Volver al panel
        </a>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <!-- Inventario vacío -->
    <div th:if="${#lists.isEmpty(inventario)}"
         class="alert alert-info">
        No tienes productos registrados en tu inventario.
    </div>

    <!-- Tabla de productos -->
    <div th:unless="${#lists.isEmpty(inventario)}"
         class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Estado</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="producto : ${inventario}">

                        <td th:text="${producto.idProductoVendedor}"></td>

                        <td class="fw-semibold"
                            th:text="${producto.nombreProducto}"></td>

                        <td th:text="${producto.descripcionProducto}"></td>

                        <td>
                            $<span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></span>
                        </td>

                        <td>
                            <span th:if="${producto.activo}"
                                  class="badge text-bg-success">
                                Activo
                            </span>

                            <span th:unless="${producto.activo}"
                                  class="badge text-bg-danger">
                                Inactivo
                            </span>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
